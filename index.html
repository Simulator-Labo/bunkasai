<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文化祭 株価シミュレーター（全員同期版）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:15px;background:#000;color:#fff;font-family:Arial,"Yu Gothic",sans-serif}h1{text-align:center;margin:5px 0 10px}button{cursor:pointer;border:0;border-radius:7px;font-weight:bold}input,select{width:100%;padding:10px;margin-bottom:8px;background:#000;color:#fff;border:1px solid #555;border-radius:6px;font-size:16px}.sync{max-width:1200px;margin:0 auto 10px;padding:9px;border-radius:8px;text-align:center;background:#171717;border:1px solid #444}.sync.ok{color:#7dff9a}.sync.bad{color:#ff8d8d}.top-ranking,.reception-status{text-align:center;font-size:17px;margin-bottom:13px;color:#ddd}.reception-on{color:#7dff9a}.view-buttons{max-width:1200px;margin:15px auto;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.view-buttons button,.reception-buttons button{padding:9px 13px;background:#222;color:#fff;border:1px solid #555}.back-button{display:none;position:fixed;top:10px;right:10px;z-index:2000;padding:10px 15px;background:#fff;color:#000}.charts-grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.chart-card{background:#080808;border:1px solid #333;border-radius:12px;padding:12px}.chart-title{text-align:center;font-size:21px;font-weight:bold}.chart-price{text-align:center;font-size:27px;font-weight:bold;margin:5px 0 10px}.chart-canvas-wrap{position:relative;height:280px}.chart-news{margin-top:10px;padding:10px;background:#111;border-radius:8px;min-height:105px}.latest-news{font-weight:bold;text-align:center}.past-news{border-top:1px solid #333;margin-top:8px;padding-top:7px;font-size:13px;color:#bbb;line-height:1.6}.controls-area{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.panel,.reception-panel,.holders,.ranking,.history{max-width:1200px;margin:20px auto;background:#111;border-radius:10px;padding:15px}.panel h2,.ranking h2,.holders h2,.reception-panel h2{text-align:center;margin-top:0}.trade-buttons,.reception-buttons{display:flex;gap:8px;flex-wrap:wrap}.trade-buttons button{flex:1;padding:12px;font-size:17px}.buy,.create,.modal-button,.danger-button{background:#fff;color:#000}.sell{background:#555;color:#fff}.create,.modal-button,.danger-button,.close-button{width:100%;padding:12px}.message{text-align:center;min-height:35px;margin-top:8px;line-height:1.5}.note{font-size:12px;color:#aaa;line-height:1.5}.reception-only{display:none}.reception-buttons button{flex:1;min-width:150px}.holder,.rank-item{background:#181818;border:1px solid #333;padding:10px;margin-bottom:8px;border-radius:8px}.holder-name{font-size:18px;font-weight:bold}.holder-info{margin-top:5px;line-height:1.7}.rank-item{display:grid;grid-template-columns:60px 1fr 160px;gap:10px;align-items:center}.rank-number{font-weight:bold;font-size:18px}.rank-total{text-align:right;font-weight:bold}.history-item{padding:8px;border-bottom:1px solid #333;line-height:1.6}.modal{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:20px}.modal-box{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:#111;border:1px solid #555;border-radius:12px;padding:20px}.modal-box h2{text-align:center}.close-button{margin-top:10px;background:#222;color:#fff;border:1px solid #555}.danger-button{margin-top:10px}body.display-mode{padding-top:50px}body.display-mode .hide-in-display,body.display-mode .chart-news{display:none!important}body.display-mode .charts-grid{max-width:none;width:100%}body.display-mode .chart-canvas-wrap{height:40vh}body.display-mode .back-button{display:block}body.single-chart .charts-grid{display:block}body.single-chart .chart-card{display:none}body.single-chart .chart-card.active-large{display:block;width:100%}body.single-chart .chart-canvas-wrap{height:75vh}body.single-chart .chart-title{font-size:28px}body.single-chart .chart-price{font-size:42px}
@media(max-width:850px){.charts-grid,.controls-area{grid-template-columns:1fr}.chart-canvas-wrap{height:260px}.rank-item{grid-template-columns:50px 1fr}.rank-total{grid-column:2;text-align:left}body.display-mode .chart-canvas-wrap{height:42vh}body.single-chart .chart-canvas-wrap{height:75vh}}
</style>

<body>
<button class="back-button" onclick="normalView()">通常画面に戻る</button>
<div class="hide-in-display">
  <h1>文化祭 株価シミュレーター</h1>
  <div id="syncStatus" class="sync">Firebaseへ接続中…</div>
  <div class="top-ranking">🏆 現在1位：<strong id="firstPlaceName">---</strong> ／ <strong id="firstPlaceMoney">---</strong>円</div>
  <div class="reception-status" id="receptionStatus">通常モード</div>
  <div class="view-buttons"><button onclick="fourChartView()">4チャート大表示</button><button onclick="singleChartView(0)">チャート1 大表示</button><button onclick="singleChartView(1)">チャート2 大表示</button><button onclick="singleChartView(2)">チャート3 大表示</button><button onclick="singleChartView(3)">チャート4 大表示</button></div>
</div>
<div class="charts-grid" id="chartsGrid"></div>
<div class="hide-in-display">
  <div class="controls-area">
    <div class="panel"><h2>新しい名義を作成</h2><input id="createName" placeholder="名義"><input type="password" id="createPassword" placeholder="名義用パスワード"><button class="create" onclick="createAccount()">名義を作成</button><div class="message" id="createMessage"></div><div class="note">同じ名義は2つ作れません。<br>新しい名義の初期所持金は1000円です。</div></div>
    <div class="panel"><h2>株を売買</h2><select id="stockSelect"><option value="0">チャート1</option><option value="1">チャート2</option><option value="2">チャート3</option><option value="3">チャート4</option></select><input id="tradeName" placeholder="名義"><div id="tradePasswordArea"><input type="password" id="tradePassword" placeholder="パスワード"></div><input id="tradeQuantity" inputmode="numeric" placeholder="取引株数"><div class="trade-buttons"><button class="buy" onclick="buyStock()">買う</button><button class="sell" onclick="sellStock()">売る</button></div><div class="message" id="tradeMessage"></div><div class="note">通常モードでは名義とパスワードが必要です。<br>買える・売れる株数を超えた場合は最大数へ自動変更します。</div></div>
  </div>
  <div class="reception-only reception-panel"><h2>受付専用機能</h2><div class="reception-buttons"><button onclick="openWithdrawPanel()">引き出し</button><button onclick="openOwnerPassword()">Ownerパネル</button><button onclick="openResetPassword()">ゲームをリセット</button></div></div>
  <div class="reception-only holders"><h2>名義一覧</h2><div id="holders">まだ名義がありません</div></div>
  <div class="ranking"><h2>🏆 総資産ランキング</h2><p style="text-align:center;font-size:12px;color:#aaa">総資産 ＝ 所持金 ＋ 4銘柄すべての保有株価値</p><div id="rankingList">まだ名義がありません</div></div>
  <div class="reception-only history"><h2>売買履歴</h2><div id="tradeHistory">まだ売買されていません</div></div>
</div>

<div class="modal" id="withdrawModal"><div class="modal-box"><h2>引き出し</h2><input id="withdrawName" placeholder="名義"><input type="password" id="withdrawPassword" placeholder="名義パスワード"><input type="number" id="withdrawAmount" min="1" placeholder="引き出し金額"><button class="modal-button" onclick="withdrawMoney()">引き出す</button><p id="withdrawMessage" style="text-align:center"></p><button class="close-button" onclick="closeModal('withdrawModal')">閉じる</button></div></div>
<div class="modal" id="ownerPasswordModal"><div class="modal-box"><h2>Ownerパスワード</h2><input type="password" id="ownerPassword" placeholder="パスワード"><button class="modal-button" onclick="checkOwnerPassword()">確定</button><p id="ownerPasswordMessage" style="text-align:center"></p><button class="close-button" onclick="closeModal('ownerPasswordModal')">閉じる</button></div></div>
<div class="modal" id="ownerPanelModal"><div class="modal-box"><h2>⚙ Ownerパネル</h2><input id="ownerName" placeholder="変更する名義"><input type="number" id="ownerMoney" min="0" placeholder="所持金"><input type="number" id="ownerStock0" min="0" placeholder="チャート1 所持株数"><input type="number" id="ownerStock1" min="0" placeholder="チャート2 所持株数"><input type="number" id="ownerStock2" min="0" placeholder="チャート3 所持株数"><input type="number" id="ownerStock3" min="0" placeholder="チャート4 所持株数"><button class="modal-button" onclick="changeOwnerData()">データを変更</button><button class="close-button" onclick="deleteOwnerName()">名義を削除</button><p id="ownerMessage" style="text-align:center"></p><button class="close-button" onclick="closeModal('ownerPanelModal')">Ownerパネルを閉じる</button></div></div>
<div class="modal" id="resetPasswordModal"><div class="modal-box"><h2>ゲームリセット</h2><input type="password" id="resetPassword" placeholder="リセットパスワード"><button class="modal-button" onclick="checkResetPassword()">確定</button><p id="resetPasswordMessage" style="text-align:center"></p><div id="resetConfirmArea" style="display:none"><button class="danger-button" onclick="performReset()">本当にゲームをリセットする</button></div><button class="close-button" onclick="closeModal('resetPasswordModal')">閉じる</button></div></div>

<script type="module">
/* Firebaseコンソールの「プロジェクトの設定 → マイアプリ」に表示された値へ置き換えてください */
const firebaseConfig={
  apiKey:"AIzaSyAQ9sGxKPfwD9XH0qk9RY9ayHNcZt_205M",
  authDomain:"bunka-ca0b7.firebaseapp.com",
  databaseURL:"https://bunka-ca0b7-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"bunka-ca0b7",
  storageBucket:"bunka-ca0b7.firebasestorage.app",
  messagingSenderId:"412023385867",
  appId:"1:412023385867:web:ceb67271ea36c378bbbc0e"
};

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getDatabase,ref,onValue,runTransaction}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const INITIAL_PRICE=200,INITIAL_MONEY=1000,MIN_PRICE=50,EFFECT_SECONDS=120,MAX_TRADE_EFFECT=100,MAX_COMBINED_EFFECT=150;
const RECEPTION_NAME="受付",RECEPTION_PASSWORD="1090",OWNER_PASSWORD="0730",RESET_PASSWORD="3860";
const STOCK_DEFS=[
 {name:"チャート1",lineColor:"red",news:[{text:"社長の不祥事が発覚",direction:"down",min:50,max:150},{text:"フローライトを発見",direction:"up",min:50,max:150},{text:"料理にネズミ混入",direction:"down",min:50,max:150}]},
 {name:"チャート2",lineColor:"#ff9f40",news:[{text:"腐ってるパンを提供し炎上",direction:"down",min:70,max:120},{text:"インスタで商品がバズる",direction:"up",min:60,max:140},{text:"パンが硬すぎて歯が欠ける",direction:"down",min:70,max:120}]},
 {name:"チャート3",lineColor:"#00d084",news:[{text:"ピザのチーズが腐ってる",direction:"down",min:80,max:140},{text:"テレビで紹介される",direction:"up",min:120,max:160},{text:"ウイルスで客が来ない",direction:"down",min:80,max:140}]},
 {name:"チャート4",lineColor:"#b87cff",news:[{text:"韓国アイドルが熱愛",direction:"down",min:100,max:160},{text:"韓国のラーメンが流行る",direction:"up",min:50,max:200},{text:"アイドルが徴兵に行く",direction:"down",min:100,max:160}]}
];
const clientId=crypto.randomUUID(),charts=[],statusEl=document.getElementById("syncStatus");
let game=null,db=null,gameRef=null,serverOffset=0,receptionMode=false,connected=false;
const rint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),round1=v=>Math.round(v*10)/10,fmt=v=>round1(v).toLocaleString(undefined,{maximumFractionDigits:1});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
const nowServer=()=>Date.now()+serverOffset;
function defaultStock(i,now){return{price:INITIAL_PRICE,lastNewsIndex:-1,nextNewsTime:now+rint(40,120)*1000,newsEvents:[],activeEffects:[],points:Array(30).fill(INITIAL_PRICE),labels:Array.from({length:30},(_,j)=>"-"+(30-j)+"秒")}}
function defaultGame(){const n=nowServer();return{schema:2,shareholders:{},history:[],stocks:STOCK_DEFS.map((_,i)=>defaultStock(i,n)),leaderId:"",leaderUntil:0,lastTick:n}}
function makeCards(){document.getElementById("chartsGrid").innerHTML=STOCK_DEFS.map((s,i)=>`<div class="chart-card" id="chartCard${i}"><div class="chart-title">${s.name}</div><div class="chart-price"><span id="price${i}">200</span>円</div><div class="chart-canvas-wrap"><canvas id="chart${i}"></canvas></div><div class="chart-news"><div class="latest-news" id="latestNews${i}">まだニュースはありません</div><div class="past-news" id="pastNews${i}">過去のニュース：なし</div></div></div>`).join("");STOCK_DEFS.forEach((s,i)=>charts[i]=new Chart(document.getElementById("chart"+i),{type:"line",data:{labels:[],datasets:[{label:s.name,data:[],borderColor:s.lineColor,borderWidth:3,pointRadius:0,tension:0}]},options:{responsive:true,maintainAspectRatio:false,animation:false,scales:{x:{ticks:{color:"#fff",maxTicksLimit:8},grid:{color:"#292929"}},y:{suggestedMin:50,ticks:{color:"#fff"},grid:{color:"#292929"}}},plugins:{legend:{labels:{color:"#fff"}}}}}))}
makeCards();
function remaining(s,kind){return(s.activeEffects||[]).filter(e=>!kind||e.kind===kind).reduce((a,e)=>a+e.remaining,0)}
function limitCombined(s,x){const old=remaining(s);return round1(clamp(old+x,-MAX_COMBINED_EFFECT,MAX_COMBINED_EFFECT)-old)}
function limitTrade(s,x){const old=remaining(s,"trade"),allowed=clamp(old+x,-MAX_TRADE_EFFECT,MAX_TRADE_EFFECT)-old;return limitCombined(s,allowed)}
function buyImpact(q){return q<50?0:Math.min(.5+Math.floor((q-50)/2)*.5,100)}function sellImpact(q){return q<50?0:-Math.min(1+Math.floor((q-50)/2),100)}
function executionPrice(s,impact){return round1(Math.max(MIN_PRICE,s.price+impact/2))}
function addNews(s,i){const defs=STOCK_DEFS[i].news;let k;do{k=rint(0,defs.length-1)}while(defs.length>1&&k===s.lastNewsIndex);s.lastNewsIndex=k;const d=defs[k],requested=(d.direction==="up"?1:-1)*rint(d.min,d.max),allowed=limitCombined(s,requested),id=clientId+"-"+Date.now()+"-"+Math.random();s.newsEvents=[{id,text:d.text,display:d.text,finished:false},...(s.newsEvents||[])].slice(0,3);s.activeEffects=s.activeEffects||[];s.activeEffects.push({kind:"news",eventId:id,remaining:allowed,applied:0,secondsLeft:EFFECT_SECONDS});s.nextNewsTime=nowServer()+rint(40,120)*1000}
function processStock(s){const effects=s.activeEffects||[];let proposed=0;for(const e of effects){if(e.secondsLeft>0){e.step=e.remaining/e.secondsLeft;proposed+=e.step}}let actual=proposed;if(s.price+actual<MIN_PRICE)actual=MIN_PRICE-s.price;const ratio=proposed===0?1:clamp(actual/proposed,0,1);for(const e of effects){if(e.secondsLeft<=0)continue;const a=e.step*ratio;e.applied+=a;e.remaining-=e.step;e.secondsLeft--;delete e.step;if(e.secondsLeft<=0&&e.kind==="news"){const ev=(s.newsEvents||[]).find(x=>x.id===e.eventId);if(ev&&!ev.finished){ev.finished=true;ev.applied=round1(e.applied);ev.display=ev.text+"（"+(ev.applied>0?"+":"")+fmt(ev.applied)+"円）"}}}s.activeEffects=effects.filter(e=>e.secondsLeft>0);s.price=round1(Math.max(MIN_PRICE,s.price+actual))}
function tickState(g,tickTime){g.stocks.forEach((s,i)=>{if(tickTime>=s.nextNewsTime)addNews(s,i);processStock(s);const d=new Date(tickTime),label=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,"0")).join(":");s.labels=[...(s.labels||[]),label].slice(-300);s.points=[...(s.points||[]),s.price].slice(-300)});g.lastTick=tickTime}
async function leaderLoop(){if(!gameRef)return;const n=nowServer();try{await runTransaction(gameRef,g=>{if(!g)return defaultGame();if(!g.leaderId||g.leaderUntil<n||g.leaderId===clientId){g.leaderId=clientId;g.leaderUntil=n+5000;if(g.leaderId===clientId){let ticks=Math.min(5,Math.max(0,Math.floor((n-(g.lastTick||n))/1000)));while(ticks-->0)tickState(g,(g.lastTick||n)+1000)}}return g},{applyLocally:false})}catch(e){setStatus("同期中にエラーが起きました。通信を確認してください。",false)}}
function setStatus(text,ok){statusEl.textContent=text;statusEl.className="sync "+(ok?"ok":"bad")}
function render(){if(!game)return;game.stocks.forEach((s,i)=>{document.getElementById("price"+i).textContent=fmt(s.price);charts[i].data.labels=s.labels||[];charts[i].data.datasets[0].data=s.points||[];charts[i].update("none");const ev=s.newsEvents||[];document.getElementById("latestNews"+i).textContent=ev[0]?.display||"まだニュースはありません";document.getElementById("pastNews"+i).innerHTML=ev.length<2?"過去のニュース：なし":ev.slice(1,3).map((e,j)=>(j+1)+"個前： "+esc(e.display)).join("<br>")});updateRanking();updateHolders();updateHistory()}
function totals(){return Object.keys(game.shareholders||{}).map(name=>{const t=game.shareholders[name];return{name,money:t.money,total:t.money+t.stocks.reduce((a,q,i)=>a+q*game.stocks[i].price,0)}}).sort((a,b)=>b.total-a.total)}
function updateRanking(){const a=totals(),el=document.getElementById("rankingList");if(!a.length){el.textContent="まだ名義がありません";firstPlaceName.textContent="---";firstPlaceMoney.textContent="---";return}firstPlaceName.textContent=a[0].name;firstPlaceMoney.textContent=fmt(a[0].total);el.innerHTML=a.map((x,i)=>`<div class="rank-item"><div class="rank-number">${i+1}位</div><div><strong>${esc(x.name)}</strong><br><small>現金：${fmt(x.money)}円</small></div><div class="rank-total">${fmt(x.total)}円</div></div>`).join("")}
function updateHolders(){const el=document.getElementById("holders"),names=Object.keys(game.shareholders||{});if(!names.length){el.textContent="まだ名義がありません";return}el.innerHTML=names.map(name=>{const t=game.shareholders[name],total=t.money+t.stocks.reduce((a,q,i)=>a+q*game.stocks[i].price,0);return`<div class="holder"><div class="holder-name">${esc(name)}</div><div class="holder-info">所持金：<strong>${fmt(t.money)}円</strong><br>チャート1：${t.stocks[0]}株 ／ チャート2：${t.stocks[1]}株<br>チャート3：${t.stocks[2]}株 ／ チャート4：${t.stocks[3]}株<br>総資産：<strong>${fmt(total)}円</strong></div></div>`}).join("")}
function updateHistory(){const el=document.getElementById("tradeHistory"),h=game.history||[];if(!h.length){el.textContent="まだ売買されていません";return}el.innerHTML=h.map(t=>`<div class="history-item"><strong>${t.type==="buy"?"🟢 購入":"🔴 売却"}</strong> ／ ${esc(t.stockName)} ／ 名義：${esc(t.name)} ／ ${t.quantity}株 ／ 約定：${fmt(t.price)}円 ／ 合計：${fmt(t.total)}円 ／ 株価影響：${t.impact>0?"+":""}${fmt(t.impact)}円 ／ ${esc(t.time)}</div>`).join("")}
async function mutate(fn,errorText="処理できませんでした。") {if(!connected||!gameRef){showTradeMessage("Firebaseに接続されていません。");return null}try{return await runTransaction(gameRef,g=>{if(!g)return;return fn(g)===false?undefined:g},{applyLocally:false})}catch(e){showTradeMessage(errorText);return null}}
window.createAccount=async()=>{const name=createName.value.trim(),pw=createPassword.value;if(!name)return createMessage.textContent="名義を入力してください。";if(!pw)return createMessage.textContent="パスワードを作ってください。";if(name===RECEPTION_NAME||name.toLowerCase()==="3c")return createMessage.textContent="その名義はシステム用なので使用できません。";let reason="";const r=await mutate(g=>{g.shareholders=g.shareholders||{};if(g.shareholders[name]){reason="その名義はすでに登録されています。";return false}g.shareholders[name]={password:pw,money:INITIAL_MONEY,stocks:[0,0,0,0]}});if(r?.committed){createName.value=createPassword.value="";createMessage.textContent=name+"を作成しました。"}else if(reason)createMessage.textContent=reason};
function authTrader(g,name,pw){return receptionMode?!!g.shareholders?.[name]:g.shareholders?.[name]?.password===pw}
function getMaxBuy(t,s){let lo=0,hi=Math.floor(t.money/MIN_PRICE)+1;while(lo+1<hi){const m=Math.floor((lo+hi)/2),impact=limitTrade(s,buyImpact(m)),cost=round1(executionPrice(s,impact)*m);if(cost<=t.money)lo=m;else hi=m}return lo}
async function trade(type){const i=+stockSelect.value,name=tradeName.value.trim(),pw=tradePassword.value,q0=parseInt(tradeQuantity.value,10);if(type==="buy"&&!receptionMode&&name===RECEPTION_NAME&&pw===RECEPTION_PASSWORD){receptionMode=true;updateReceptionMode();showTradeMessage("受付専用機能を解放しました。");return}if(!Number.isInteger(q0)||q0<=0)return showTradeMessage("正しい株数を入力してください。");let msg="",done=false;await mutate(g=>{const t=g.shareholders?.[name],s=g.stocks[i];if(!t){msg="その名義は登録されていません。";return false}if(!authTrader(g,name,pw)){msg="パスワードが違います。";return false}let q=q0,converted=false;if(type==="buy"){const max=getMaxBuy(t,s);if(max<=0){msg="現在の所持金では購入できません。";return false}if(q>max){q=max;converted=true}const impact=limitTrade(s,buyImpact(q)),price=executionPrice(s,impact),total=round1(price*q);t.money=round1(t.money-total);t.stocks[i]+=q;if(impact)s.activeEffects.push({kind:"trade",remaining:impact,applied:0,secondsLeft:EFFECT_SECONDS});record(g,type,name,i,q,price,total,impact);msg=converted?`買える最大数の${q}株に変更して購入しました。`:`${q}株購入しました。`;tradeQuantity.value=q}else{const owned=t.stocks[i];if(owned<=0){msg="この株を持っていません。";return false}if(q>owned){q=owned;converted=true}const impact=limitTrade(s,sellImpact(q)),price=executionPrice(s,impact),total=round1(price*q);t.stocks[i]-=q;t.money=round1(t.money+total);if(impact)s.activeEffects.push({kind:"trade",remaining:impact,applied:0,secondsLeft:EFFECT_SECONDS});record(g,type,name,i,q,price,total,impact);msg=converted?`売れる最大数の${q}株に変更して売却しました。`:`${q}株売却しました。`;tradeQuantity.value=q}done=true});if(msg)showTradeMessage(msg)}
function record(g,type,name,i,q,price,total,impact){const d=new Date();g.history=[{type,name,stockName:STOCK_DEFS[i].name,quantity:q,price,total,impact,time:d.toLocaleTimeString()},...(g.history||[])].slice(0,200)}
window.buyStock=()=>trade("buy");window.sellStock=()=>trade("sell");
function showTradeMessage(t){tradeMessage.textContent=t;setTimeout(()=>{if(tradeMessage.textContent===t)tradeMessage.textContent=""},4000)}
function updateReceptionMode(){document.querySelectorAll(".reception-only").forEach(e=>e.style.display=receptionMode?"block":"none");tradePasswordArea.style.display=receptionMode?"none":"block";receptionStatus.textContent=receptionMode?"● 受付モード":"通常モード";receptionStatus.className="reception-status"+(receptionMode?" reception-on":"")}
window.openWithdrawPanel=()=>{if(receptionMode){withdrawModal.style.display="flex";withdrawMessage.textContent=""}};window.closeModal=id=>document.getElementById(id).style.display="none";
window.withdrawMoney=async()=>{const name=withdrawName.value.trim(),pw=withdrawPassword.value,a=parseFloat(withdrawAmount.value);let msg="";await mutate(g=>{const t=g.shareholders?.[name];if(!t){msg="その名義はありません。";return false}if(t.password!==pw){msg="パスワードが違います。";return false}if(!Number.isFinite(a)||a<=0){msg="引き出し金額を正しく入力してください。";return false}if(a>t.money){msg="残高が足りません。";return false}t.money=round1(t.money-a);msg=fmt(a)+"円引き出しました。"});withdrawMessage.textContent=msg};
window.openOwnerPassword=()=>{if(receptionMode){ownerPasswordModal.style.display="flex";ownerPassword.value="";ownerPasswordMessage.textContent=""}};window.checkOwnerPassword=()=>{if(ownerPassword.value===OWNER_PASSWORD){closeModal("ownerPasswordModal");ownerPanelModal.style.display="flex"}else ownerPasswordMessage.textContent="パスワードが違います。"};
window.changeOwnerData=async()=>{const name=ownerName.value.trim(),money=parseFloat(ownerMoney.value),qs=[ownerStock0,ownerStock1,ownerStock2,ownerStock3].map(x=>parseInt(x.value,10));let msg="";await mutate(g=>{if(!g.shareholders?.[name]){msg="その名義はありません。";return false}if(!Number.isFinite(money)||money<0){msg="所持金を正しく入力してください。";return false}if(qs.some(v=>!Number.isInteger(v)||v<0)){msg="4つすべての株数を正しく入力してください。";return false}g.shareholders[name].money=round1(money);g.shareholders[name].stocks=qs;msg=name+"のデータを変更しました。"});ownerMessage.textContent=msg};
window.deleteOwnerName=async()=>{const name=ownerName.value.trim();if(!game?.shareholders?.[name])return ownerMessage.textContent="その名義はありません。";if(!confirm(name+"を削除しますか？"))return;await mutate(g=>{delete g.shareholders[name]});ownerMessage.textContent=name+"を削除しました。"};
window.openResetPassword=()=>{if(receptionMode){resetPasswordModal.style.display="flex";resetPassword.value="";resetPasswordMessage.textContent="";resetConfirmArea.style.display="none"}};window.checkResetPassword=()=>{if(resetPassword.value===RESET_PASSWORD){resetPasswordMessage.textContent="パスワード確認OK";resetConfirmArea.style.display="block"}else resetPasswordMessage.textContent="パスワードが違います。"};window.performReset=async()=>{if(!confirm("本当にゲームをリセットしますか？\n名義・所持金・株・履歴がすべて消えます。"))return;await runTransaction(gameRef,()=>defaultGame());receptionMode=false;updateReceptionMode();closeModal("resetPasswordModal")};
window.fourChartView=()=>{clearLarge();document.body.classList.add("display-mode");document.body.classList.remove("single-chart");setTimeout(resize,100)};window.singleChartView=i=>{clearLarge();document.body.classList.add("display-mode","single-chart");document.getElementById("chartCard"+i).classList.add("active-large");setTimeout(resize,100)};window.normalView=()=>{clearLarge();document.body.classList.remove("display-mode","single-chart");setTimeout(resize,100)};function clearLarge(){document.querySelectorAll(".chart-card").forEach(c=>c.classList.remove("active-large"))}function resize(){charts.forEach(c=>c.resize())}
updateReceptionMode();
async function start(){if(Object.values(firebaseConfig).some(v=>v.startsWith("ここに"))){setStatus("Firebaseの接続情報が未入力です。HTML上部のfirebaseConfigを書き換えてください。",false);return}try{const app=initializeApp(firebaseConfig);db=getDatabase(app);await signInAnonymously(getAuth(app));onValue(ref(db,".info/serverTimeOffset"),s=>serverOffset=s.val()||0);onValue(ref(db,".info/connected"),s=>{connected=!!s.val();setStatus(connected?"● 全員同期中":"通信が切れています。再接続を待っています。",connected)});gameRef=ref(db,"festivalStockGame");await runTransaction(gameRef,g=>g||defaultGame());onValue(gameRef,s=>{game=s.val();if(game)render()});setInterval(leaderLoop,1000);leaderLoop()}catch(e){console.error(e);const detail=e?.code||e?.message||String(e);setStatus("接続エラー："+detail,false)}}start();
</script>
